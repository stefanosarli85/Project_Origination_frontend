name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Project_Origination_frontend
            git pull origin main

            # Build Docker image
            sudo docker build -t project_origination_frontend .

            # Stop and remove old container
            sudo docker stop project-origination-frontend || true
            sudo docker rm project-origination-frontend || true

            # Run new container
            sudo docker run -d \
              -p 80:80 \
              --restart always \
              --name project-origination-frontend \
              project_origination_frontend

            echo "✅ Frontend deployed!"